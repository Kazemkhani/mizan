[project]
name = "mizan"
version = "0.1.0"
description = "Sovereign AI Model Registry and Adaptive Compliance Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    # Data access: SQLAlchemy Core provides a dialect-agnostic query layer.
    # Switching to Postgres requires only a connection-string change; no DDL
    # or query rewrites. We do NOT use the ORM; all SQL is explicit.
    "sqlalchemy>=2.0.0",
    # Scientific computing for the bandit engine
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    # PDF certificate generation.
    # WeasyPrint renders HTML/CSS to PDF and handles RTL Arabic layout via
    # Pango. It is the correct choice for a bilingual certificate because
    # the certificate template reuses the same CSS design tokens as the web
    # layer. System prerequisites: pango, cairo, gobject-introspection.
    # See docs/DECISIONS.md item D-005.
    "weasyprint>=61.0",
    # Prototype certificate signing. Deployment-grade asymmetric keys and
    # external verification remain explicit roadmap work.
    "cryptography>=42.0.0",
    # HTTP client used by the evaluation harness and test suite
    "httpx>=0.27.0",
    # Async database driver used by the SQLAlchemy engine under asyncio
    "aiosqlite>=0.20.0",
    "greenlet>=3.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mizan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Slow tests are deselected by default. A suite nobody will wait for is a suite
# nobody runs, and full-corpus regeneration takes minutes. The marker existed
# but was never registered, so it silently deselected nothing and the suite grew
# to just under fifteen minutes. CI runs the slow set explicitly.
addopts = "-m 'not slow'"
markers = [
    "slow: regenerates the full corpus or otherwise takes minutes to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Start with rules that catch syntax errors, unused code and ambiguous names.
# Broader style and modernisation sets can be adopted separately once their
# existing findings are reviewed rather than hidden in a mass rewrite.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These entry-point scripts establish a repository root or temporary database
# before importing the application. The import order is an execution boundary.
"scripts/reset.py" = ["E402"]
"scripts/run_demo.py" = ["E402"]
"scripts/run_e2e.py" = ["E402"]
"scripts/seed.py" = ["E402"]
"tests/test_harness.py" = ["E402"]
