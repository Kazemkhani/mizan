[project]
name = "mizan"
version = "0.1.0"
description = "Sovereign AI Model Registry and Adaptive Compliance Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    # API layer
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    # Data access: SQLAlchemy Core provides a dialect-agnostic query layer.
    # Switching to Postgres requires only a connection-string change; no DDL
    # or query rewrites. We do NOT use the ORM; all SQL is explicit.
    "sqlalchemy>=2.0.52",
    # Scientific computing for the bandit engine
    "numpy>=2.5.2",
    "matplotlib>=3.11.1",
    # PDF certificate generation.
    # WeasyPrint renders HTML/CSS to PDF and handles RTL Arabic layout via
    # Pango. It is the correct choice for a bilingual certificate because
    # the certificate template reuses the same CSS design tokens as the web
    # layer. System prerequisites: pango, cairo, gobject-introspection.
    # See docs/DECISIONS.md item D-005.
    "weasyprint>=69.0",
    # Cryptographic signing (signature stub in Wave 0, wired in Wave 3)
    "cryptography>=50.0.0",
    # HTTP client used by the evaluation harness and test suite
    "httpx>=0.28.1",
    # Async database driver used by the SQLAlchemy engine under asyncio
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mizan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Slow tests are deselected by default. A suite nobody will wait for is a suite
# nobody runs, and full-corpus regeneration takes minutes. The marker existed
# but was never registered, so it silently deselected nothing and the suite grew
# to just under fifteen minutes. CI runs the slow set explicitly.
addopts = "-m 'not slow'"
markers = [
    "slow: regenerates the full corpus or otherwise takes minutes to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
