version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
    # Major action migrations need an explicit review of release notes and
    # permissions. Dependabot security updates are not affected by this rule.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      web:
        patterns:
          - "*"
    # Keep routine maintenance low-noise. React, TypeScript, and other major
    # upgrades are reviewed as dedicated migrations with runtime coverage.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Update the resolved environment without needlessly raising this
    # application's declared minimum compatible versions.
    versioning-strategy: lockfile-only
    labels:
      - dependencies
    groups:
      python:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
