name: Bug report
description: Report reproducible behaviour that is incorrect or unsafe.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MIZAN. For vulnerabilities, use the private route in SECURITY.md instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and what is the practical impact?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and evidence
      description: Include unpiped command output, logs, screenshots or evidence hashes. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: MIZAN commit or version
      placeholder: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, uv, Node and browser versions where relevant.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secret, personal data or undisclosed vulnerability.
          required: true
        - label: I have read and will follow the Code of Conduct.
          required: true
