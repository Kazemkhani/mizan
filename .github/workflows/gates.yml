name: gates

# Every claim in this repository is executable. This workflow runs the claims.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: audit gates and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect proof-sensitive changes
        id: proof_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- \
            .github/workflows/gates.yml Makefile pyproject.toml uv.lock \
            mizan engine agents suites scripts tests docs/evidence; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Python lint
        run: uv run ruff check .

      - name: Tests
        run: uv run python -m pytest -q

      # The slow set regenerates the full corpus to prove generation is
      # deterministic. Kept out of the default run so `make test` stays usable,
      # but it still runs here: a test excluded everywhere is a test deleted.
      - name: Slow tests, full corpus regeneration
        if: steps.proof_scope.outputs.required == 'true'
        run: uv run python -m pytest -q -m slow

      - name: Register discipline, E001 to E005
        run: python3 scripts/audit/register_lint.py

      - name: Contrast, WCAG AA composited
        run: python3 scripts/audit/verify_contrast.py

      - name: Grounding and honesty, G1 to G3
        run: python3 scripts/audit/verify_grounding.py

      - name: Evidence integrity
        if: steps.proof_scope.outputs.required == 'true'
        run: |
          uv run python scripts/seed.py
          uv run python scripts/run_e2e.py --profile compliant --seed 42
          uv run python scripts/verify_evidence.py

      - name: Determinism, same seed must give the same bundle hash
        if: steps.proof_scope.outputs.required == 'true'
        run: |
          A=$(uv run python scripts/run_e2e.py --profile compliant --seed 42 | grep -A2 "bundle hash" | tail -1 | tr -d ' ')
          B=$(uv run python scripts/run_e2e.py --profile compliant --seed 42 | grep -A2 "bundle hash" | tail -1 | tr -d ' ')
          echo "run 1: $A"
          echo "run 2: $B"
          test "$A" = "$B" || { echo "DETERMINISM BROKEN"; exit 1; }

      - name: The measured proof
        if: steps.proof_scope.outputs.required == 'true'
        run: uv run python scripts/prove_reduction.py

  interface:
    name: interface build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Dependency audit
        run: npm audit --audit-level=moderate
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
