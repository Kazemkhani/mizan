<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="3" fill="#0A1628"/>
  <!-- Beam (horizontal bar) -->
  <rect x="4" y="10" width="24" height="2" rx="1" fill="#F0B52A"/>
  <!-- Centre post -->
  <rect x="15" y="10" width="2" height="13" fill="#F0B52A"/>
  <!-- Base -->
  <rect x="10" y="22" width="12" height="2" rx="1" fill="#F0B52A"/>
  <!-- Left arm drop -->
  <rect x="4" y="12" width="2" height="4" fill="#F0B52A"/>
  <!-- Left pan -->
  <rect x="2" y="16" width="6" height="2" rx="1" fill="#F0B52A"/>
  <!-- Right arm drop -->
  <rect x="26" y="12" width="2" height="4" fill="#F0B52A"/>
  <!-- Right pan -->
  <rect x="24" y="16" width="6" height="2" rx="1" fill="#F0B52A"/>
</svg>
