<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
  <rect width="1270" height="760" fill="#071426"/>
  <text x="80" y="86" fill="#f0ac00" font-family="monospace" font-size="14" letter-spacing="4">PROOF OVER THEATRE</text>
  <text x="80" y="156" fill="#f5f0e6" font-family="Arial, sans-serif" font-size="52" font-weight="700">The claims are executable.</text>
  <text x="80" y="200" fill="#9dafc5" font-family="Arial, sans-serif" font-size="21">Open the repo, replay the runs, inspect the hashes and run the gates.</text>
  <g transform="translate(80 270)" font-family="Arial, sans-serif">
    <g><rect width="260" height="255" rx="22" fill="#0b1b30" stroke="#263d59" stroke-width="2"/><text x="24" y="58" fill="#f0ac00" font-size="54" font-weight="700">36</text><text x="24" y="96" fill="#f5f0e6" font-size="24" font-weight="700">controls</text><text x="24" y="145" fill="#9dafc5" font-size="16">Published register with</text><text x="24" y="170" fill="#9dafc5" font-size="16">weights, requirements</text><text x="24" y="195" fill="#9dafc5" font-size="16">and provenance.</text></g>
    <g transform="translate(282)"><rect width="260" height="255" rx="22" fill="#0b1b30" stroke="#263d59" stroke-width="2"/><text x="24" y="58" fill="#f0ac00" font-size="54" font-weight="700">05</text><text x="24" y="96" fill="#f5f0e6" font-size="24" font-weight="700">use-case suites</text><text x="24" y="145" fill="#9dafc5" font-size="16">Different thresholds and</text><text x="24" y="170" fill="#9dafc5" font-size="16">controls for different</text><text x="24" y="195" fill="#9dafc5" font-size="16">public-service risks.</text></g>
    <g transform="translate(564)"><rect width="260" height="255" rx="22" fill="#0b1b30" stroke="#263d59" stroke-width="2"/><text x="24" y="58" fill="#f0ac00" font-size="43" font-weight="700">AR + EN</text><text x="24" y="96" fill="#f5f0e6" font-size="24" font-weight="700">native by design</text><text x="24" y="145" fill="#9dafc5" font-size="16">Suites, attacks, interface</text><text x="24" y="170" fill="#9dafc5" font-size="16">and assurance records</text><text x="24" y="195" fill="#9dafc5" font-size="16">with correct RTL.</text></g>
    <g transform="translate(846)"><rect width="260" height="255" rx="22" fill="#0b1b30" stroke="#f0ac00" stroke-width="2"/><text x="24" y="58" fill="#f0ac00" font-size="38" font-weight="700">SHA-256</text><text x="24" y="96" fill="#f5f0e6" font-size="24" font-weight="700">evidence chain</text><text x="24" y="145" fill="#9dafc5" font-size="16">Append-only records make</text><text x="24" y="170" fill="#9dafc5" font-size="16">an edit or deletion</text><text x="24" y="195" fill="#9dafc5" font-size="16">detectable.</text></g>
  </g>
  <text x="80" y="615" fill="#7f94ae" font-family="monospace" font-size="15" letter-spacing="2">CI: LINT · TESTS · REGISTER DISCIPLINE · CONTRAST · GROUNDING · EVIDENCE INTEGRITY · DETERMINISM</text>
  <rect x="80" y="646" width="1110" height="2" fill="#1b2f49"/><circle cx="1168" cy="647" r="8" fill="#f0ac00"/>
